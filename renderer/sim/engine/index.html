<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face { font-family: "JP"; src: url("../../assets/fonts/NotoSansJP-VF.ttf"); font-weight: 100 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1426; font-family: "JP", sans-serif; }
#gl { position: absolute; inset: 0; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.badge { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); padding: 10px 26px; border-radius: 40px;
  background: rgba(0,0,0,.55); color: #fff; font-weight: 700; font-size: 30px; white-space: nowrap; }
#title { position: absolute; top: 250px; width: 100%; text-align: center; color: #fff; font-weight: 900; font-size: 90px; line-height: 1.2; white-space: nowrap;
  text-shadow: -6px 0 0 rgba(0,224,255,.75), 6px 0 0 rgba(255,40,80,.75), 0 8px 24px rgba(0,0,0,.6); letter-spacing: 2px; }
#title em { font-style: normal; color: #ff3b4e; }
#setting { position: absolute; top: 540px; width: 100%; text-align: center; color: #fff; font-weight: 800; font-size: 46px;
  text-shadow: 0 0 10px #000, 0 0 4px #000, 0 4px 0 #000; }
#cd { position: absolute; left: 30px; top: 640px; color: #fff; background: rgba(0,0,0,.45); padding: 12px 28px 6px; border-radius: 18px; }
#cd .label { font-weight: 800; font-size: 40px; text-shadow: 0 0 8px #000, 0 3px 0 #000; }
#cd .time { font-family: "DejaVu Sans Mono", monospace; font-weight: 700; font-size: 132px; color: #ff4d5e; letter-spacing: 4px;
  text-shadow: 0 0 18px rgba(255,60,80,.9), 0 0 4px #fff; }
#cap { position: absolute; bottom: 300px; width: 100%; text-align: center; padding: 0 60px; box-sizing: border-box; }
#cap span { display: inline-block; background: rgba(0,0,0,.62); color: #fff; font-weight: 900; font-size: 60px; line-height: 1.35;
  padding: 18px 34px; border-radius: 18px; }
#cap b { color: #ffd23f; }
#cap span.twist { background: rgba(220,40,60,.85); font-size: 66px; }
#big { position: absolute; top: 260px; width: 100%; text-align: center; color: #ffd23f; font-weight: 900; font-size: 74px;
  text-shadow: 0 0 22px rgba(0,0,0,.9), 0 6px 0 #000; }
#big small { display: block; color: #fff; font-size: 44px; font-weight: 800; margin-top: 18px; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #111; font-weight: 800; font-size: 40px;
  padding: 14px 30px 14px 70px; border-radius: 40px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.bubble:before { content: ""; position: absolute; left: 26px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: #13a36e; }
.bubble:after { content: ""; position: absolute; left: 50%; bottom: -18px; margin-left: -14px; border: 14px solid transparent; border-top-color: #fff; border-bottom: 0; }
#end { position: absolute; inset: 0; background: rgba(9,14,28,.9); color: #fff; padding: 230px 80px 0; box-sizing: border-box; }
#end h1 { font-size: 76px; font-weight: 900; line-height: 1.3; margin: 0 0 60px; }
#end h1 b { color: #ffd23f; }
#end h2 { font-size: 40px; font-weight: 900; color: #9fb4d8; margin: 40px 0 14px; }
#end p { font-size: 34px; line-height: 1.6; margin: 0; color: #e6ecf8; }
#end .note { position: absolute; bottom: 140px; left: 80px; right: 80px; font-size: 32px; color: #ffb3b3; font-weight: 700; }
.hide { display: none !important; }
</style></head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="ui">
  <div class="badge">AIシミュレーション｜実際の出来事ではありません</div>
  <div id="title" class="hide"></div>
  <div id="setting" class="hide"></div>
  <div id="cd" class="hide"><div class="label"></div><div class="time"></div></div>
  <div id="big" class="hide"></div>
  <div id="cap" class="hide"><span></span></div>
  <div id="bubbles"></div>
  <div id="end" class="hide"></div>
</div>
<script type="module" src="./sim.js"></script>
</body></html>
